        <div style="{{ item.wrapStyle }}" onMouseEnter="{{ item.onEnter }}" onMouseLeave="{{ item.onLeave }}">
          <div style="{{ item.floatStyle }}">
            <div style="position: absolute; inset: 0; border: 1px solid rgba(236,234,226,0.16); overflow: hidden; background: #1A1912; box-shadow: 0 14px 30px -12px rgba(0,0,0,0.5);">
              <image-slot id="{{ item.slotId }}" shape="rect" src="{{ item.img }}" placeholder="{{ item.label }}" style="width: 100%; height: 100%; display: block;"></image-slot>
            </div>
          </div>
        </div>
      </sc-for>

      <sc-for list="{{ images }}" as="item" hint-placeholder-count="15">
        <div style="{{ item.titleStyle }}">
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.55; margin-bottom: 10px;">{{ item.num }} · {{ item.cat }} · {{ item.year }}</div>
          <div style="font-size: clamp(48px, 9vw, 150px); font-weight: 500; line-height: 0.92; letter-spacing: -0.03em; white-space: nowrap;">{{ item.name }}</div>
        </div>
      </sc-for>

      <div style="position: absolute; bottom: 34px; left: 0; right: 0; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.5;">All rights reserved · ©2026 Public Display</div>
    </div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { progress: 0, vw: 1440, vh: 900, clock: "", hovered: null, mx: 0.5 };

  data = [
    { name: "Chromatic Drift", cat: "Motion", year: "2018", img: "" },
    { name: "Paper Signals", cat: "Editorial", year: "2019", img: "" },
    { name: "Soft Machine", cat: "WebGL", year: "2019", img: "" },
    { name: "Null Object", cat: "Identity", year: "2020", img: "" },
    { name: "Latent Garden", cat: "Type", year: "2020", img: "" },
    { name: "Quiet Static", cat: "Sound", year: "2021", img: "" },
    { name: "Ghost Grid", cat: "Layout", year: "2021", img: "" },
    { name: "Warm Data", cat: "Data Viz", year: "2022", img: "" },
    { name: "Slow Light", cat: "Photography", year: "2022", img: "" },
    { name: "Half Tone", cat: "Print", year: "2023", img: "" },
    { name: "Echo Chamber", cat: "Interaction", year: "2023", img: "" },
    { name: "Dust & Pixels", cat: "Texture", year: "2024", img: "" },
    { name: "Margin Notes", cat: "Editorial", year: "2024", img: "" },
    { name: "Blank Signal", cat: "Brand", year: "2025", img: "" },
    { name: "After Image", cat: "Motion", year: "2025", img: "" },
  ];

  // scatter: px/py fraction of available space; w px; ratio h/w; rot deg
  scatter = [
    { px: 0.05, py: 0.14, w: 210, ratio: 0.74, rot: -9 },
    { px: 0.72, py: 0.07, w: 176, ratio: 1.24, rot: 8 },
    { px: 0.40, py: 0.55, w: 232, ratio: 0.66, rot: -4 },
    { px: 0.86, py: 0.58, w: 184, ratio: 1.16, rot: 11 },
    { px: 0.13, py: 0.70, w: 200, ratio: 0.80, rot: 6 },
    { px: 0.55, py: 0.24, w: 162, ratio: 1.30, rot: -12 },
    { px: 0.28, py: 0.10, w: 172, ratio: 1.10, rot: 5 },
    { px: 0.63, py: 0.72, w: 214, ratio: 0.70, rot: -7 },
    { px: 0.92, py: 0.20, w: 158, ratio: 1.28, rot: 10 },
    { px: 0.02, py: 0.44, w: 190, ratio: 0.92, rot: -5 },
    { px: 0.46, py: 0.80, w: 168, ratio: 1.14, rot: 9 },
    { px: 0.78, py: 0.40, w: 196, ratio: 0.78, rot: -10 },
    { px: 0.20, py: 0.36, w: 150, ratio: 1.22, rot: 7 },
    { px: 0.34, py: 0.30, w: 178, ratio: 0.86, rot: -6 },
    { px: 0.66, py: 0.48, w: 156, ratio: 1.18, rot: 12 },
  ];

  componentDidMount() {
    this.onScroll = () => {
      const el = document.getElementById("scrollzone");
      if (!el) return;
      const vh = window.innerHeight;
      const r = el.getBoundingClientRect();
      const total = r.height - vh;
      let p = total > 0 ? -r.top / total : 0;
      p = Math.max(0, Math.min(1, p));
      this.setState({ progress: p, vw: window.innerWidth, vh });
    };
    this.onResize = () => this.setState({ vw: window.innerWidth, vh: window.innerHeight }, this.onScroll);
    this.tick = () => {
      const d = new Date();
      this.setState({ clock: String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") });
    };
    this.targetMx = 0.5; this.smx = 0.5;
    this.onMove = (ev) => { this.targetMx = Math.max(0, Math.min(1, ev.clientX / window.innerWidth)); };
    this.onTouch = (ev) => { const t = ev.touches && ev.touches[0]; if (t) this.targetMx = Math.max(0, Math.min(1, t.clientX / window.innerWidth)); };
    this.raf = () => {
      this.smx += (this.targetMx - this.smx) * 0.08;
      if (Math.abs(this.targetMx - this.smx) > 0.0004) this.setState({ mx: this.smx });
      this.rafId = requestAnimationFrame(this.raf);
    };
    window.addEventListener("scroll", this.onScroll, { passive: true });
    window.addEventListener("resize", this.onResize);
    window.addEventListener("mousemove", this.onMove, { passive: true });
    window.addEventListener("touchstart", this.onTouch, { passive: true });
    window.addEventListener("touchmove", this.onTouch, { passive: true });
    this.clockId = setInterval(this.tick, 1000);
    this.tick();
    this.onResize();
    this.rafId = requestAnimationFrame(this.raf);
  }
  componentWillUnmount() {
    window.removeEventListener("scroll", this.onScroll);
    window.removeEventListener("resize", this.onResize);
    window.removeEventListener("mousemove", this.onMove);
    window.removeEventListener("touchstart", this.onTouch);
    window.removeEventListener("touchmove", this.onTouch);
    clearInterval(this.clockId);
    cancelAnimationFrame(this.rafId);
  }

  lerp(a, b, t) { return a + (b - a) * t; }
  ease(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
  clamp01(x) { return Math.max(0, Math.min(1, x)); }

  renderVals() {
    const { progress, vw, vh, clock, mx } = this.state;
    const alignP = this.clamp01(progress / 0.82);
    const e = this.ease(alignP);
    const n = this.data.length;

    const alignW = Math.min(178, Math.max(120, vw / 8));
    const alignH = alignW * 1.34;
    const gap = 60;
    const cellW = alignW + gap;
    const stripW = n * cellW;
    const maxPan = Math.max(0, stripW - vw + gap);
    const m = (mx == null ? 0.5 : mx);
    const stripLeft = maxPan > 0 ? (gap / 2 - m * maxPan) : (vw - stripW) / 2;
    const rowCenterY = vh * 0.58;

    const images = this.data.map((d, i) => {
      const s = this.scatter[i];
      const sw = s.w, sh = s.w * s.ratio;
      const sx = s.px * (vw - sw);
      const sy = (0.46 + s.py * 0.46) * (vh - sh);
      const ax = stripLeft + i * cellW + (cellW - alignW) / 2;
      const ay = rowCenterY - alignH / 2;

      const x = this.lerp(sx, ax, e);
      const y = this.lerp(sy, ay, e);
      const w = this.lerp(sw, alignW, e);
      const h = this.lerp(sh, alignH, e);
      const rot = this.lerp(s.rot, 0, e);

      const depth = ((i * 53) % 100) / 100;
      const dscale = this.lerp(1 - depth * 0.12, 1, e);
      const hv = this.state.hovered;
      const isHover = hv === i;
      const dimActive = hv !== null && hv !== undefined;
      const depthDim = this.lerp(1 - depth * 0.3, 1, e);
      const blur = this.lerp(depth * 5.5, 0, e);
      const wrapStyle = {
        position: "absolute", left: 0, top: 0,
        width: w + "px", height: h + "px",
        transform: `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${dscale.toFixed(3)})`,
        filter: blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : "none",
        opacity: (dimActive ? (isHover ? 1 : this.lerp(1, 0.16, e)) : 1) * depthDim,
        transition: "opacity 0.4s ease",
        cursor: "pointer",
        zIndex: isHover ? 30 : Math.round((1 - depth) * 10) + 1,
        willChange: "transform, opacity, filter",
      };

      const amp = (7 + depth * 6) * (0.45 + (1 - e) * 1.55);
      const rotAmp = (0.6 + depth * 1.5) * (0.4 + (1 - e) * 1.3);
      const floatStyle = {
        position: "absolute", inset: 0,
        animation: `floaty ${(4.4 + (i % 6) * 0.55).toFixed(2)}s ease-in-out infinite`,
        animationDelay: `${(-(i % 7) * 0.6).toFixed(1)}s`,
        willChange: "transform",
        "--amp": amp.toFixed(1) + "px",
        "--rot": rotAmp.toFixed(2) + "deg",
      };

      const bandTop = ay + alignH;
      const titleY = (bandTop + (vh - 90)) / 2 - 74;
      const titleShown = (e > 0.7 && isHover) ? 1 : 0;
      const titleStyle = {
        position: "absolute", left: 0, top: 0, width: vw + "px",
        transform: `translate(0px, ${titleY}px)`,
        opacity: titleShown, textAlign: "center",
        transition: "opacity 0.4s ease", pointerEvents: "none",
        willChange: "opacity", zIndex: 6,
      };

      return {
        name: d.name, cat: d.cat, year: d.year,
        img: (typeof window !== "undefined" && window.__slotImages && window.__slotImages["proj-slot-" + (i + 1)]) || d.img || undefined,
        slotId: "proj-slot-" + (i + 1),
        label: "Project " + String(i + 1).padStart(2, "0") + " — drop image",
        num: String(i + 1).padStart(2, "0"),
        wrapStyle, titleStyle, floatStyle,
        onEnter: () => this.setState({ hovered: i }),
        onLeave: () => this.setState(s => (s.hovered === i ? { hovered: null } : null)),
      };
    });

    return {
      images, clock,
      counter: String(Math.round(progress * n)).padStart(2, "0") + " / " + String(n).padStart(2, "0"),
      progressPct: (progress * 100).toFixed(1) + "%",
    };
  }
}
</script>
</body>
